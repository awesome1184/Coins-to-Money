plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = project.mod_version
group = 'com.example'
base { archivesName = 'coins-to-money' }
repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'
    if (project.hasProperty('integrationTest')) {
        runtimeOnly files(fileTree("build/integration-mods/${project.property('integrationTest')}") { include '*.jar' })
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
// Test-only Fabric mod. Never included in the distributable JAR.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        'coins-to-money' { sourceSet sourceSets.main }
        if (gradle.startParameter.taskNames.any { it.endsWith('runSmokeClient') }) {
            'coins-to-money-smoke' { sourceSet sourceSets.smoke }
        }
    }
    runs {
        smokeClient {
            client()
            source sourceSets.smoke
            runDir project.hasProperty('integrationTest') ? "build/smoke-${project.property('integrationTest')}" : 'build/smoke-base'
        }
    }
}
