name: Inspect 1.2.3 integrations
on:
  push:
    paths: ['.github/workflows/inspect-123.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect published compatible mods
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, hashlib, zipfile, io, subprocess
          from pathlib import Path
          out=Path('inspect'); out.mkdir()
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CoinsToMoney-integration-tests/1.2.3'}),timeout=90).read()
          def api(path): return json.loads(get('https://api.modrinth.com/v2/'+path))
          def select(project):
              q=urllib.parse.urlencode({'game_versions':json.dumps(['26.1.2']),'loaders':json.dumps(['fabric'])})
              versions=api('project/'+project+'/version?'+q)
              if not versions: raise RuntimeError('No 26.1.2 Fabric build for '+project)
              return next((v for v in versions if v['version_type']=='release'),versions[0])
          queue=[select('fpb5uaJt'),select('skyhanni')]; seen=set(); records=[]
          while queue:
              v=queue.pop(0)
              if v['project_id'] in seen: continue
              seen.add(v['project_id'])
              # The mod's Gradle build already supplies Fabric API.
              if v['project_id']=='P7dR8mSH': continue
              f=next((f for f in v['files'] if f['primary']),v['files'][0]); data=get(f['url'])
              assert hashlib.sha512(data).hexdigest()==f['hashes']['sha512']
              jar=out/f['filename']; jar.write_bytes(data)
              records.append({'project':v['project_id'],'version':v['version_number'],'version_id':v['id'],'filename':f['filename'],'url':f['url'],'sha512':f['hashes']['sha512'],'dependencies':v['dependencies']})
              print(json.dumps(records[-1]),flush=True)
              for d in v['dependencies']:
                  if d['dependency_type']=='required' and d.get('project_id')!='P7dR8mSH':
                      queue.append(api('version/'+d['version_id']) if d.get('version_id') else select(d['project_id']))
          (out/'dependencies.json').write_text(json.dumps(records,indent=2))
          for repo,branch,label in [('meowdding/CustomScoreboard','main','CustomScoreboard'),('hannibal002/SkyHanni','beta','SkyHanni')]:
              data=get('https://codeload.github.com/'+repo+'/zip/refs/heads/'+branch)
              (out/(label+'-source.zip')).write_bytes(data)
          pending=list(out.glob('*.jar')); processed=set()
          while pending:
              jar=pending.pop(0)
              if jar.name in processed: continue
              processed.add(jar.name)
              with zipfile.ZipFile(jar) as z:
                  names=z.namelist()
                  (out/(jar.stem+'-classes.txt')).write_text('\n'.join(n for n in names if n.endswith('.class')))
                  if 'fabric.mod.json' in names: (out/(jar.stem+'-metadata.json')).write_bytes(z.read('fabric.mod.json'))
                  for n in names:
                      if n.endswith('.jar'):
                          dest=out/Path(n).name
                          if not dest.exists(): dest.write_bytes(z.read(n)); pending.append(dest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ctm-123-inspection
          path: inspect/
