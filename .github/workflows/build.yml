name: Build and render regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build and unit regression tests
        run: gradle clean build --no-daemon
      - name: Install virtual display and screenshot tools
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick
      - name: Test enabled sidebar hooks and render settings
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 ci/smoke_client.py
      - name: Verify release does not contain test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for jar in Path('build/libs').glob('*.jar'):
              if jar.name.endswith('-sources.jar'): continue
              with zipfile.ZipFile(jar) as z:
                  assert not any('smoke' in name.lower() for name in z.namelist()), 'Test mod leaked into release'
                  assert 'com/example/skyblockusd/mixin/SidebarMixin.class' in z.namelist()
                  assert 'com/example/skyblockusd/mixin/TeamNameMixin.class' not in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coins-to-money-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            build/test-results/test/*.xml
            build/reports/tests/test/**
            build/ci-client.log
            build/*.png
            run-smoke/logs/latest.log
            run-smoke/crash-reports/*.txt
