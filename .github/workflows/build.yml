name: Build Minecraft Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile and regression tests
        run: gradle clean build --no-daemon
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Client startup and mixin smoke test
        run: python3 ci/smoke_client.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload mod and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coins-to-money-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
            build/test-results/test/*.xml
            build/ci-client.log
            run/logs/latest.log
            !build/libs/*-sources.jar
