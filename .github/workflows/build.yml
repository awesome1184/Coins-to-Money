name: Build Minecraft Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile and regression tests
        run: gradle clean build smokeClasses --no-daemon
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Actual sidebar and settings rendering tests
        run: python3 ci/smoke_client.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Install verified optional test mods
        run: python3 ci/integration_dependencies.py
      - name: Current CustomScoreboard integration
        run: python3 ci/smoke_client.py custom
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: SkyHanni integration
        run: python3 ci/smoke_client.py hanni
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Combined CustomScoreboard and SkyHanni integration
        run: python3 ci/smoke_client.py both
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Source snapshot
        if: always()
        run: git archive --format=zip HEAD -o build/source-snapshot.zip
      - name: Verify distribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          for jar in Path('build/libs').glob('*.jar'):
              if jar.name.endswith('-sources.jar'):
                  continue
              with zipfile.ZipFile(jar) as z:
                  assert not any('SmokeTest' in name for name in z.namelist())
                  assert json.loads(z.read('fabric.mod.json'))['id'] == 'coins-to-money'
                  assert json.loads(z.read('coins-to-money.mixins.json'))['client'] == ['SidebarMixin', 'CustomScoreboardNumberMixin', 'CustomScoreboardLineMixin', 'CustomScoreboardChunkMixin', 'SkyHanniCoinMixin', 'SkyHanniCropMixin', 'SkyHanniStringMixin', 'SkyHanniTextMixin']
                  assert not any(name.startswith(('kotlin/', 'me/owdding/', 'at/hannibal2/')) for name in z.namelist())
              digest = hashlib.sha256(jar.read_bytes()).hexdigest()
              Path('build/SHA256SUMS').write_text(digest + '  ' + jar.name + '\n')
              print(digest, jar.name)
          PY
      - name: Upload mod and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coins-to-money-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
            build/test-results/test/*.xml
            build/ci-client.log
            build/ci-custom.log
            build/ci-hanni.log
            build/ci-both.log
            build/smoke-*/logs/latest.log
            build/smoke-*/crash-reports/*.txt
            build/SHA256SUMS
            build/source-snapshot.zip
            !build/libs/*-sources.jar
