name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build with Gradle
        run: gradle build --no-daemon
      - name: Inspect rendering pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          classes = ['net.minecraft.client.gui.Gui', 'net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.gui.Font', 'net.minecraft.client.gui.components.ChatComponent', 'net.minecraft.world.scores.PlayerScoreEntry', 'net.minecraft.world.scores.PlayerTeam', 'net.minecraft.network.chat.numbers.FixedFormat', 'net.minecraft.client.gui.screens.inventory.AbstractContainerScreen', 'net.minecraft.client.gui.screens.Screen']
          found = set()
          for root in [Path.home()/'.gradle/caches/fabric-loom', Path('.gradle')]:
              for jar in root.rglob('*.jar'):
                  try:
                      with zipfile.ZipFile(jar) as archive:
                          names = set(archive.namelist())
                      for cls in classes:
                          if cls in found or cls.replace('.', '/')+'.class' not in names:
                              continue
                          found.add(cls)
                          print('\n=== '+cls+' in '+str(jar)+' ===', flush=True)
                          result = subprocess.run(['javap', '-classpath', str(jar), '-p', '-c', cls], capture_output=True, text=True, check=True)
                          lines = result.stdout.splitlines()
                          if cls.endswith('.Gui'):
                              for i,line in enumerate(lines):
                                  if 'Scoreboard' in line or 'scoreboard' in line or 'lambda$' in line:
                                      print('\n'.join(lines[max(0,i-2):min(len(lines),i+170)]))
                          elif cls.endswith(('PlayerScoreEntry', 'PlayerTeam', 'FixedFormat')):
                              print(result.stdout)
                          else:
                              for i,line in enumerate(lines):
                                  if line.startswith('  ') and not line.startswith('    ') and '(' in line:
                                      print(line)
                          if cls.endswith('GuiGraphicsExtractor'):
                              for i,line in enumerate(lines):
                                  if (' text(' in line or ' tooltip(' in line or 'setTooltipForNextFrame' in line) and line.startswith('  '):
                                      print('\n'.join(lines[i:i+55]))
                  except (zipfile.BadZipFile, subprocess.CalledProcessError):
                      continue
          if len(found) != len(classes):
              raise SystemExit('Missing classes: '+str(set(classes)-found))
          PY
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: coins-to-money-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
