name: Build Minecraft Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile and regression tests
        run: gradle clean build --no-daemon
      - name: Inspect exact Minecraft rendering implementation
        run: |
          mkdir -p build/diagnostics
          git archive HEAD -o build/diagnostics/repository.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          targets = ['net.minecraft.client.gui.Gui', 'net.minecraft.client.gui.Gui$1DisplayEntry', 'net.minecraft.client.gui.screens.Screen', 'net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.renderer.state.gui.GuiRenderState', 'net.minecraft.world.scores.PlayerScoreEntry', 'net.minecraft.world.scores.Scoreboard', 'net.minecraft.world.scores.ScoreAccess', 'net.minecraft.world.scores.Objective', 'net.minecraft.network.chat.numbers.FixedFormat', 'net.minecraft.client.multiplayer.ClientPacketListener']
          jars = list(Path('.gradle').rglob('*.jar')) + list((Path.home()/'.gradle/caches/fabric-loom').rglob('*.jar'))
          for cls in targets:
              for jar in jars:
                  try:
                      with zipfile.ZipFile(jar) as z:
                          if cls.replace('.', '/')+'.class' not in z.namelist():
                              continue
                      data = subprocess.check_output(['javap', '-p', '-c', '-classpath', str(jar), cls], text=True)
                      Path('build/diagnostics', cls+'.txt').write_text(data)
                      break
                  except zipfile.BadZipFile:
                      pass
          PY
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coins-to-money-diagnostics-${{ github.sha }}
          path: build/diagnostics/**
