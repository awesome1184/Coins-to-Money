name: Inspect rendering fixtures
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle classes --no-daemon
      - name: Collect source and exact rendering contracts
        run: |
          mkdir -p evidence
          git archive HEAD -o evidence/source.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          classes = ['net.minecraft.client.gui.Gui', 'net.minecraft.client.gui.Gui$1DisplayEntry', 'net.minecraft.client.gui.screens.Screen', 'net.minecraft.client.renderer.GameRenderer', 'net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.renderer.state.gui.GuiRenderState', 'net.minecraft.world.scores.PlayerScoreEntry', 'net.minecraft.world.scores.Scoreboard', 'net.minecraft.world.scores.Objective', 'net.minecraft.world.scores.ScoreAccess', 'net.minecraft.network.chat.numbers.FixedFormat', 'net.minecraft.network.chat.numbers.BlankFormat', 'net.minecraft.client.multiplayer.ClientLevel', 'net.minecraft.client.gui.render.GuiRenderer', 'net.fabricmc.fabric.api.client.gametest.v1.FabricClientGameTest', 'net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext']
          found = set()
          for root in [Path.home()/'.gradle/caches', Path('.gradle')]:
              for jar in root.rglob('*.jar'):
                  try:
                      with zipfile.ZipFile(jar) as z: names = set(z.namelist())
                      for cls in classes:
                          if cls in found or cls.replace('.', '/')+'.class' not in names: continue
                          found.add(cls)
                          out = subprocess.check_output(['javap', '-classpath', str(jar), '-p', '-c', cls], text=True)
                          Path('evidence', cls+'.txt').write_text(out)
                      if 'net/fabricmc/fabric/api/client/gametest/v1/FabricClientGameTest.class' in names:
                          Path('evidence/gametest-entries.txt').write_text('\n'.join(sorted(names)))
                  except (zipfile.BadZipFile, subprocess.CalledProcessError): pass
          print('Found:', sorted(found))
          print('Missing:', sorted(set(classes)-found))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-contracts
          path: evidence/
