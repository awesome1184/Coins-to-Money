name: Inspect CustomScoreboard compatibility
on:
  push:
    paths: ['.github/workflows/compat-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect published 26.1.2 release
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, zipfile, io, pathlib, subprocess
          out=pathlib.Path('compat-inspect'); out.mkdir()
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CoinsToMoney-compatibility-test/1.2.2'}),timeout=45).read()
          def api(path): return json.loads(get('https://api.modrinth.com/v2/'+path))
          def select(project):
              q=urllib.parse.urlencode({'game_versions':json.dumps(['26.1.2']),'loaders':json.dumps(['fabric'])})
              versions=api('project/'+project+'/version?'+q)
              if not versions: raise RuntimeError('No compatible version: '+project)
              return versions[0]
          todo=[select('fpb5uaJt')]; seen=set(); records=[]
          while todo:
              version=todo.pop(0)
              if version['project_id'] in seen: continue
              seen.add(version['project_id'])
              file=next((f for f in version['files'] if f['primary']),version['files'][0])
              content=get(file['url']); assert hashlib.sha512(content).hexdigest()==file['hashes']['sha512']
              dest=out/file['filename']; dest.write_bytes(content)
              records.append({'project_id':version['project_id'],'version_id':version['id'],'version':version['version_number'],'file':file,'dependencies':version['dependencies']})
              print(version['project_id'],version['version_number'],file['filename'],flush=True)
              for dep in version['dependencies']:
                  if dep['dependency_type']!='required': continue
                  if dep['version_id']: todo.append(api('version/'+dep['version_id']))
                  elif dep['project_id']: todo.append(select(dep['project_id']))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          classes=['me.owdding.customscoreboard.elements.PurseElement','me.owdding.customscoreboard.core.CustomScoreboardRenderer','me.owdding.customscoreboard.core.ChunkedStat','me.owdding.customscoreboard.core.ScoreboardLineKt','me.owdding.customscoreboard.utils.NumberUtils','me.owdding.customscoreboard.core.NumberTrackingElement','tech.thatgravyboat.skyblockapi.api.profile.currency.CurrencyAPI']
          # Nested jar dependencies can contain the SkyBlock API.
          for dest in list(out.glob('*.jar')):
              with zipfile.ZipFile(dest) as jar:
                  for name in jar.namelist():
                      if name.endswith('.jar'):
                          (out/pathlib.Path(name).name).write_bytes(jar.read(name))
          for dest in out.glob('*.jar'):
              with zipfile.ZipFile(dest) as jar:
                  if 'fabric.mod.json' in jar.namelist():
                      (out/(dest.stem+'-metadata.json')).write_bytes(jar.read('fabric.mod.json'))
                  for cls in classes:
                      if cls.replace('.','/')+'.class' in jar.namelist():
                          r=subprocess.run(['javap','-p','-c','-classpath',str(dest),cls],capture_output=True,text=True,check=True)
                          (out/(cls+'.txt')).write_text(r.stdout)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: customscoreboard-inspection
          path: compat-inspect/**
