name: Inspect remaining 26.2 APIs
on:
  push:
    paths: ['.github/workflows/inspect-262-extra.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          mkdir -p inspection
          python3 - <<'PY'
          import hashlib,json,urllib.request,urllib.parse,subprocess
          from pathlib import Path
          out=Path('inspection')
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Coins-to-Money/26.2-port'}),timeout=60) as response:return response.read()
          manifest=json.loads(get('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          version=json.loads(get(next(v['url'] for v in manifest['versions'] if v['id']=='26.2')))
          data=get(version['downloads']['client']['url']);assert hashlib.sha1(data).hexdigest()==version['downloads']['client']['sha1']
          Path('minecraft.jar').write_bytes(data)
          for cls in ['net.minecraft.ChatFormatting','net.minecraft.world.scores.TeamColor','net.minecraft.world.scores.PlayerTeam','net.minecraft.world.scores.DisplaySlot','net.minecraft.network.chat.Style']:
              (out/(cls+'.txt')).write_text(subprocess.check_output(['javap','-p','-s','-classpath','minecraft.jar',cls],text=True))
          records=[]
          for project in ['1A2mKfBx','eXts2L7r']:
              query=urllib.parse.urlencode({'game_versions':json.dumps(['26.2']),'loaders':json.dumps(['fabric'])})
              versions=json.loads(get('https://api.modrinth.com/v2/project/'+project+'/version?'+query))
              versions.sort(key=lambda v:v['date_published'],reverse=True)
              v=next((v for v in versions if v['version_type']=='release'),versions[0])
              records.append(v)
          (out/'dependencies.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-262-extra-inspection
          path: inspection/
