name: Inspect Minecraft 26.2 port
on:
  push:
    paths: ['.github/workflows/inspect-262.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect sources, dependency releases and Minecraft GUI signatures
        shell: bash
        run: |
          mkdir -p inspection
          git archive --format=zip HEAD -o inspection/source-snapshot.zip
          python3 - <<'PY'
          import hashlib, json, subprocess, urllib.request, urllib.parse, zipfile
          from pathlib import Path
          out = Path('inspection')
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Coins-to-Money/26.2-port'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read(128*1024*1024)
          def versions(project):
              query = urllib.parse.urlencode({'game_versions': json.dumps(['26.2']), 'loaders': json.dumps(['fabric'])})
              return json.loads(get('https://api.modrinth.com/v2/project/'+project+'/version?'+query))
          records = []
          selected = {}
          for project in ['fabric-api', 'modmenu', 'custom-scoreboard', 'skyhanni', 'fabric-language-kotlin']:
              try:
                  candidates = versions('fpb5uaJt' if project == 'custom-scoreboard' else project)
                  candidates.sort(key=lambda v: v['date_published'], reverse=True)
                  v = next((v for v in candidates if v['version_type'] == 'release'), candidates[0] if candidates else None)
                  if v is None:
                      records.append({'project': project, 'unavailable': True}); continue
                  f = next((f for f in v['files'] if f['primary']), v['files'][0])
                  record = {'project': project, 'project_id':v['project_id'], 'version_id':v['id'], 'version': v['version_number'], 'game_versions':v['game_versions'], 'dependencies':v['dependencies'], 'file':f}
                  records.append(record); selected[project] = record
                  if project in ['custom-scoreboard', 'skyhanni']:
                      data = get(f['url']); assert hashlib.sha512(data).hexdigest() == f['hashes']['sha512']
                      jar = out/f['filename']; jar.write_bytes(data)
                      with zipfile.ZipFile(jar) as z:
                          (out/(project+'-metadata.json')).write_bytes(z.read('fabric.mod.json'))
                          for name in z.namelist():
                              if name.endswith('.class') and any(term in name for term in ['PurseElement', 'CustomScoreboardRenderer', 'ChunkedStat', 'ScoreboardLineKt', 'TextRenderable', 'StringRenderable', 'ItemPriceUtils', 'SkyHanniTracker', 'CropMoneyDisplay']):
                                  cls = name[:-6].replace('/', '.')
                                  (out/(cls+'.txt')).write_text(subprocess.check_output(['javap','-p','-s','-c','-classpath',str(jar),cls],text=True))
              except Exception as ex:
                  records.append({'project': project, 'error':repr(ex)})
          (out/'dependencies.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2),flush=True)
          try:
              (out/'fabric-loader.json').write_bytes(get('https://meta.fabricmc.net/v2/versions/loader/26.2'))
              (out/'loom-versions.xml').write_bytes(get('https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml'))
          except Exception as ex:
              print('Metadata:',ex)
          command = ['gradle','compileJava','--no-daemon','-Pminecraft_version=26.2','-Pfabric_api_version='+selected['fabric-api']['version'],'-Pmodmenu_version='+selected['modmenu']['version']]
          result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (out/'compile-262.log').write_text(result.stdout)
          print(result.stdout[-22000:])
          found = set()
          for root in [Path.home()/'.gradle/caches/fabric-loom',Path('.gradle')]:
              for jar in root.rglob('*.jar'):
                  if '26.2' not in str(jar): continue
                  try:
                      with zipfile.ZipFile(jar) as z:
                          names = [n for n in z.namelist() if n.endswith('.class') and (n.startswith('net/minecraft/client/gui/') and any(t in n for t in ['Hud', 'Gui.class', 'GuiGraphicsExtractor', 'screens/Screen.class', 'components/AbstractWidget', 'components/EditBox', 'components/Button', 'DisplayEntry', 'GuiRenderer']) or n in ['net/minecraft/client/Minecraft.class','net/minecraft/client/renderer/state/gui/GuiRenderState.class'])]
                      for name in names:
                          if name in found: continue
                          found.add(name); cls = name[:-6].replace('/', '.')
                          args = ['javap','-p','-s','-classpath',str(jar),cls]
                          if any(t in cls for t in ['Hud','gui.Gui','gui.screens.Screen']): args.insert(2,'-c')
                          (out/(cls+'.txt')).write_text(subprocess.check_output(args,text=True))
                  except (zipfile.BadZipFile, subprocess.CalledProcessError): pass
          print('Dumped',len(found),'Minecraft classes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-262-port-inspection
          path: inspection/
